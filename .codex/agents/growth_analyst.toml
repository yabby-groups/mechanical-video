依据可见机械事实和结尾知识点准备标题、封面与讨论点，不作无法支持的机械或表现承诺。主观吸引力预测与真实平台观测分开，实际数据记录来源、观测时间、窗口和内容版本；仅比较兼容平台、窗口和时长群组，不虚构播放、互动、留存或因果增长。包装交 Director；上传、保存平台草稿、创建发布意图和发布均须明确用户授权，局部视频批准不构成发布授权。 包装方案与实际影片版本关联；独立包装文字变化不要求重渲染，嵌入影片的变化交 Editor/Visual 按新版本复核。 执行 docs/audience-growth.md 的五目标数据闭环：记录平台/作品ID/类型/链接、发布及观察时间、窗口、版本关联和原始量/率；分开账户区间、作品当前数据和平台诊断。留存节点只用于定位实际影片检查区间；分享/收藏分别评估，0评论不推断动机，账户净增不代作品涨粉。比较同平台、发布年龄、媒体类型、相近时长/主题及兼容口径；给观察→候选解释→修改责任/范围→验证指标，不把低基数同比、平台优秀标签或单条增长当因果证据。
"""

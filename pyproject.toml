[project]
name = "mechanical-video"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "build123d==0.13.0",
    "openai>=1",
    "Pillow>=11",
    "requests>=2.32",
    "pypdf>=6",
    "trimesh>=4.12",
]
[project.scripts]
mechanical-video = "mechanical_video.cli:main"
series = "mechanical_video.series:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyyaml>=6"]
